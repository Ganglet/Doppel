apiVersion: batch/v1
kind: Job
metadata:
  name: doppel-ctgan
  namespace: doppel
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: doppel-ctgan
    spec:
      restartPolicy: Never
      containers:
        - name: ctgan-generator
          image: doppel/ctgan:0.1
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - generators.generate
            - --generator
            - ctgan
            - --seed
            - "42"
            - --param
            - epochs=1